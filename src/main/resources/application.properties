spring.application.name=fgstudio-backend

server.port=${PORT:8080}

# Database PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fgstudio_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Proxy Railway
server.forward-headers-strategy=framework

# Sessione admin
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${APP_SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${APP_SESSION_COOKIE_SAME_SITE:Lax}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Admin
app.admin.password-hash=${ADMIN_PASSWORD_HASH:}

# Log
logging.level.root=INFO
logging.level.fgstudio_backend=INFO